name: Generate Snake

on:
  # roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda quando der push na main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # gera as versões clara e escura (cobra rosa)
      - name: Gerar SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E4405F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E4405F

      # publica os SVGs na branch output
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}